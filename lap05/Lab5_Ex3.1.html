<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Infographic bài tập 2.1 và video YouTube bài tập 2.2 của Lab 05.">
	<title>Lab 05 | Infographic và video</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			color: #172a35;
			background: #f2f5f2;
			font-family: "Segoe UI", sans-serif;
			line-height: 1.6;
		}

		header {
			padding: 2.5rem 1.25rem 2rem;
			color: #fff;
			background: #176b67;
			text-align: center;
		}

		header h1 {
			margin: 0 0 0.5rem;
			font-size: clamp(1.8rem, 5vw, 2.6rem);
		}

		header p {
			max-width: 42rem;
			margin: 0 auto;
		}

		main {
			width: min(100% - 2rem, 58rem);
			margin: 2rem auto;
		}

		section {
			margin-bottom: 2rem;
		}

		h2 {
			margin: 0 0 0.75rem;
			color: #176b67;
			font-size: 1.45rem;
		}

		figure {
			margin: 0;
			padding: 1rem;
			background: #fff;
			border: 1px solid #d8e2dd;
			border-radius: 6px;
		}

		figure img {
			display: block;
			width: 100%;
			height: auto;
		}

		figcaption {
			margin-top: 0.75rem;
			color: #52646b;
			font-size: 0.9rem;
		}

		.video-frame {
			position: relative;
			width: 100%;
			aspect-ratio: 16 / 9;
			overflow: hidden;
			background: #172a35;
		}

		.video-frame iframe {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			border: 0;
		}

		footer {
			padding: 1.25rem;
			color: #52646b;
			background: #e4ebe6;
			text-align: center;
			font-size: 0.88rem;
		}

		footer p {
			max-width: 58rem;
			margin: 0 auto;
		}
	</style>
</head>
<body>
	<header>
		<h1>Lab 05: Infographic và video</h1>
		<p>Xem infographic của bài tập 2.1 và video hướng dẫn cho Nhiệm vụ 2.2.</p>
	</header>

	<main>
		<section aria-labelledby="infographic-title">
			<h2 id="infographic-title">Infographic bài tập 2.1</h2>
			<figure>
				<img src="Lab05_Ex2.1.png" alt="Infographic của bài tập 2.1 trong Lab 05" loading="lazy">
				<figcaption>Nguồn: Lab05_Ex2.1.png</figcaption>
			</figure>
		</section>

		<section aria-labelledby="video-title">
			<h2 id="video-title">Video Nhiệm vụ 2.2</h2>
			<div class="video-frame">
				<iframe
					src="https://www.youtube.com/embed/8fpDaMwGgFU"
					title="Video YouTube cho Nhiệm vụ 2.2"
					loading="lazy"
					allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
					referrerpolicy="strict-origin-when-cross-origin"
					allowfullscreen>
				</iframe>
			</div>
		</section>
	</main>

	<footer>
		<p>Bản quyền infographic và video thuộc về các tác giả hoặc đơn vị phát hành tương ứng. Trang được thực hiện phục vụ mục đích học tập.</p>
	</footer>
</body>
</html>
